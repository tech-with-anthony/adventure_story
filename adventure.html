<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1a0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Adventure Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-panel: #16241b;
    --bg-panel-edge: #24382a;
    --green: #3e6b48;
    --green-bright: #6fae74;
    --gold: #d9b25b;
    --gold-bright: #f0cf82;
    --text: #e7e2d4;
    --text-dim: #b3ac98;
    --shadow: rgba(0,0,0,0.55);
    --arcane: #6a4d8a;
    --arcane-bright: #b08ad4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(62,107,72,0.25), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(74,53,38,0.35), transparent 50%),
      linear-gradient(160deg, #0a110c 0%, #0c140f 50%, #090d0a 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 19px;
    line-height: 1.75;
  }

  /* PAGE SYSTEM */
  .page { display: none; min-height: 100vh; }
  .page.active { display: flex; }

  .page-col {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: clamp(1.5rem, 5vw, 3rem) 1.25rem;
  }

  .panel {
    background: linear-gradient(180deg, var(--bg-panel) 0%, #11201a 100%);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 14px;
    padding: clamp(1.25rem, 4vw, 2.25rem);
    box-shadow: 0 18px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  /* SCENE HEADER */
  .scene-header { text-align: center; margin-bottom: 0.85rem; }
  .chapter-label {
    font-family: 'Cinzel', serif;
    color: var(--green-bright);
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.35rem;
  }
  .scene-header h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(217,178,91,0.25), 0 1px 2px #000;
    letter-spacing: 0.04em;
  }
  .scene-location { font-style: italic; color: var(--text-dim); font-size: 0.95rem; margin-top: 0.3rem; }

  /* CLASS BADGE */
  .class-badge-wrap { text-align: center; margin-bottom: 1rem; }
  .class-badge {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.18rem 0.8rem;
    border-radius: 20px;
    border: 1px solid;
  }
  .class-badge.fighter { color: var(--green-bright); border-color: var(--green); }
  .class-badge.wizard  { color: var(--arcane-bright); border-color: var(--arcane); }
  .class-badge.rogue   { color: var(--text-dim); border-color: #4a4a3a; }
  .class-badge.cleric  { color: var(--gold-bright); border-color: var(--gold); }

  /* STORY TEXT */
  .story-text { display: flex; flex-direction: column; gap: 1.5rem; }
  .passage {
    margin: 0;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.55s ease forwards;
  }
  .passage.emphasis {
    font-family: 'Cinzel', serif;
    color: var(--gold-bright);
    font-size: 1.25rem;
    letter-spacing: 0.06em;
    text-align: center;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .passage { animation: none; opacity: 1; transform: none; }
  }

  /* INTERACTION */
  .interaction {
    margin-top: 1.75rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--bg-panel-edge);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .interaction[hidden] { display: none; }
  .choice-prompt {
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: var(--gold-bright);
    text-align: center;
    letter-spacing: 0.03em;
    line-height: 1.35;
  }

  /* BUTTONS */
  .btn-row { display: flex; flex-wrap: wrap; gap: 0.85rem; justify-content: center; }
  button {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    color: var(--text);
    background: linear-gradient(180deg, var(--green) 0%, #2c4d34 100%);
    border: 1px solid var(--green-bright);
    border-radius: 10px;
    padding: 0.7rem 1.6rem;
    min-height: 48px;
    flex: 1 1 auto;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
  }
  button:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--green-bright) 0%, var(--green) 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 18px var(--shadow);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button.primary {
    background: linear-gradient(180deg, var(--gold) 0%, #b88f3c 100%);
    border-color: var(--gold-bright);
    color: #2a1f0c;
    font-weight: 700;
  }
  button.primary:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input[type="text"]:focus-visible {
    outline: 3px solid var(--gold-bright);
    outline-offset: 2px;
  }

  /* STORY CHOICE BUTTONS — stacked column */
  .choices-col { flex-direction: column; align-items: stretch; }
  .choices-col button { flex: none; width: 100%; text-align: left; font-size: 0.97rem; }


  /* SETUP PAGE */
  #page-setup { align-items: center; justify-content: center; }
  #page-setup .page-col { align-items: center; text-align: center; max-width: 580px; }
  #page-setup > .page-col > h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(1.8rem, 7vw, 3rem);
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(217,178,91,0.25), 0 1px 2px #000;
    letter-spacing: 0.04em;
    margin-bottom: 0.3rem;
  }
  .subtitle { color: var(--green-bright); font-style: italic; font-size: 1.05rem; letter-spacing: 0.03em; margin-bottom: 1.75rem; }
  #setup-box {
    width: 100%;
    background: linear-gradient(180deg, var(--bg-panel) 0%, #11201a 100%);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 14px;
    padding: clamp(1.5rem, 5vw, 2.5rem);
    box-shadow: 0 18px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .setup-intro-text { color: var(--text-dim); font-style: italic; line-height: 1.7; margin-bottom: 1.75rem; }
  .setup-prompt {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    color: var(--gold-bright);
    letter-spacing: 0.03em;
    margin-bottom: 1.25rem;
    line-height: 1.3;
  }
  .setup-field { display: flex; flex-direction: column; gap: 0.85rem; }
  input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 1.1rem;
    color: var(--text);
    background: #0d1712;
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 0.75rem 0.95rem;
    min-height: 48px;
    text-align: center;
  }
  input[type="text"]::placeholder { color: #6f7a6c; font-style: italic; }
  .error-msg { color: #e89b7d; font-size: 0.95rem; font-style: italic; min-height: 1.2rem; }

  /* CLASS PICKER */
  .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-top: 1.25rem; }
  .class-card {
    background: linear-gradient(180deg, var(--bg-panel) 0%, #0f1c14 100%);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 10px;
    padding: 1.1rem 0.85rem;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-height: 48px;
  }
  .class-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--shadow); }
  .class-card:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
  .class-card.fighter { border-color: var(--green); }
  .class-card.fighter:hover { border-color: var(--green-bright); }
  .class-card.wizard  { border-color: var(--arcane); }
  .class-card.wizard:hover  { border-color: var(--arcane-bright); }
  .class-card.rogue   { border-color: #4a4a3a; }
  .class-card.rogue:hover   { border-color: var(--text-dim); }
  .class-card.cleric  { border-color: var(--gold); }
  .class-card.cleric:hover  { border-color: var(--gold-bright); }
  .class-card-name { font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.08em; }
  .class-card.fighter .class-card-name { color: var(--green-bright); }
  .class-card.wizard  .class-card-name { color: var(--arcane-bright); }
  .class-card.rogue   .class-card-name { color: var(--text-dim); }
  .class-card.cleric  .class-card-name { color: var(--gold-bright); }
  .class-card-tag { font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
  .class-card-desc { font-size: 0.83rem; color: var(--text-dim); font-style: italic; line-height: 1.4; margin-top: 0.2rem; }

  @media (max-width: 480px) {
    body { font-size: 18px; }
    .btn-row button { flex: 1 1 100%; }
    .class-grid { grid-template-columns: 1fr; }
  }

  /* LIBRARY PAGE */
  #page-library { align-items: flex-start; }
  .library-col { max-width: 800px; }

  .library-header { text-align: center; margin-bottom: 2rem; }
  .library-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(2rem, 7vw, 3.2rem);
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(217,178,91,0.25), 0 1px 2px #000;
    letter-spacing: 0.04em;
    margin-bottom: 0.3rem;
  }

  .story-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.25rem;
    width: 100%;
  }

  .story-card {
    background: linear-gradient(180deg, var(--bg-panel) 0%, #0f1c14 100%);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 14px;
    padding: clamp(1.25rem, 4vw, 1.75rem);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--text);
    min-height: 48px;
    width: 100%;
  }
  .story-card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px var(--shadow);
  }
  .story-card:focus-visible {
    outline: 3px solid var(--gold-bright);
    outline-offset: 2px;
  }

  .story-card-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    color: var(--gold-bright);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }
  .story-card-blurb {
    font-size: 0.92rem;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.55;
  }
  .story-card-classes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.25rem;
  }
  .story-class-chip {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.15rem 0.6rem;
    border-radius: 20px;
    border: 1px solid;
  }
  .story-class-chip.fighter { color: var(--green-bright); border-color: var(--green); }
  .story-class-chip.wizard  { color: var(--arcane-bright); border-color: var(--arcane); }
  .story-class-chip.rogue   { color: var(--text-dim); border-color: #4a4a3a; }
  .story-class-chip.cleric  { color: var(--gold-bright); border-color: var(--gold); }
  .story-class-chip.unknown { color: var(--text-dim); border-color: #4a4a3a; }

  @media (max-width: 480px) {
    .story-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LIBRARY PAGE — story selection, shown on app open -->
<section id="page-library" class="page" aria-label="Story library">
  <div class="page-col library-col">
    <header class="library-header">
      <h1 class="library-title">Adventure Stories</h1>
      <p class="subtitle">Choose your tale</p>
    </header>
    <div id="story-grid" class="story-grid" role="list"></div>
  </div>
</section>

<!-- SETUP PAGE -->
<section id="page-setup" class="page" aria-label="Character creation">
  <div class="page-col">
    <h1 id="setup-title"></h1>
    <p class="subtitle">A choose your own adventure</p>
    <div id="setup-box">
      <div id="setup-content"></div>
    </div>
  </div>
</section>

<!-- SCENE PAGE — all story content renders here dynamically -->
<section id="page-scene" class="page" aria-label="Adventure">
  <div class="page-col">
    <div class="scene-header">
      <p id="scene-chapter" class="chapter-label"></p>
      <h1 id="scene-title"></h1>
      <p id="scene-location" class="scene-location"></p>
    </div>
    <div class="class-badge-wrap">
      <span id="class-badge" class="class-badge"></span>
    </div>
    <div class="panel" aria-live="polite">
      <div id="scene-text" class="story-text"></div>
      <div id="scene-interact" class="interaction" hidden></div>
    </div>
  </div>
</section>

<script src="catalog.js"></script>
<script src="engine.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
