<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1a0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Adventure Stories</title>
<script>(function(){try{var t=localStorage.getItem('adv_theme'),f=localStorage.getItem('adv_fontsize');if(t)document.documentElement.dataset.theme=t;if(f)document.documentElement.dataset.fontsize=f;}catch(e){}}());</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* ---- CSS CUSTOM PROPERTIES — default: Valdrath dark theme ---- */
  :root {
    --bg-panel:      #16241b;
    --bg-panel-edge: #24382a;
    --panel-end:     #11201a;
    --card-end:      #0f1c14;
    --input-bg:      #0d1712;
    --green:         #3e6b48;
    --green-dark:    #2c4d34;
    --green-bright:  #6fae74;
    --gold:          #d9b25b;
    --gold-bright:   #f0cf82;
    --text:          #e7e2d4;
    --text-dim:      #b3ac98;
    --shadow:        rgba(0,0,0,0.55);
    --arcane:        #6a4d8a;
    --arcane-bright: #b08ad4;
    --neutral:       #4a4a3a;
    --neutral-bright:#a0a090;
    --body-bg:
      radial-gradient(circle at 20% 0%, rgba(62,107,72,0.25), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(74,53,38,0.35), transparent 50%),
      linear-gradient(160deg, #0a110c 0%, #0c140f 50%, #090d0a 100%);
    /* Accessible-contrast helper tokens (see CLAUDE.md accessibility pass notes) */
    --btn-text:        var(--text);
    --btn-hover-bg:    #3f6d49;
    --gold-text:       var(--gold-bright);
    --gold-fill:       var(--gold);
    --gold-fill-bright:var(--gold-bright);
    --gold-fill-stop2: #b88f3c;
    --error:           #e89b7d;
  }

  /* ---- PARCHMENT THEME ---- */
  html[data-theme="parchment"] {
    --body-bg: linear-gradient(160deg, #f5eedd 0%, #ede0c4 50%, #e8d4b0 100%);
    --bg-panel:      #e8d8be;
    --bg-panel-edge: #c8b090;
    --panel-end:     #dcc8a0;
    --card-end:      #d8c09c;
    --input-bg:      #f0e4cc;
    --green:         #4a7c52;
    --green-dark:    #3a6040;
    --green-bright:  #2a5c34;
    --gold:          #8a6520;
    --gold-bright:   #6b4e10;
    --text:          #2a1e0c;
    --text-dim:      #6b5a3e;
    --shadow:        rgba(0,0,0,0.18);
    --arcane:        #5a3a78;
    --arcane-bright: #3a2058;
    --neutral:       #8a7a60;
    --neutral-bright:#5a4a30;
    /* Nudged for WCAG AA — see accessibility pass notes */
    --text-dim:      #5b4c35;
    --green-bright:  #285832;
    --btn-text:      #fdfaf3;
    --btn-hover-bg:  #285832;
    --gold-text:     #62480f;
    --gold-fill:     #c9a13e;
    --gold-fill-bright: #d9b969;
    --error:         #8f3a19;
  }

  /* ---- VOID THEME ---- */
  html[data-theme="void"] {
    --body-bg:
      radial-gradient(circle at 20% 0%, rgba(26,96,112,0.28), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(50,20,80,0.32), transparent 50%),
      linear-gradient(160deg, #05050e 0%, #080810 50%, #04040c 100%);
    --bg-panel:      #0c0c1a;
    --bg-panel-edge: #1a1a30;
    --panel-end:     #080818;
    --card-end:      #0a0a18;
    --input-bg:      #060610;
    --green:         #1a6070;
    --green-dark:    #104858;
    --green-bright:  #30a0b8;
    --gold:          #604080;
    --gold-bright:   #a07bc8;
    --text:          #c8dce8;
    --text-dim:      #6888a0;
    --shadow:        rgba(0,0,0,0.72);
    --arcane:        #502878;
    --arcane-bright: #9060c0;
    --neutral:       #283848;
    --neutral-bright:#5878a0;
    /* Nudged for WCAG AA — see accessibility pass notes */
    --gold:          #7a52a3;
    --arcane-bright: #986bc4;
    --neutral-bright:#6080a7;
    --btn-hover-bg:  #1b6576;
    --gold-fill:        #6d4293;
    --gold-fill-bright: #754a9b;
    --gold-fill-stop2:  #502878;
  }

  /* ---- EMBER THEME ---- */
  html[data-theme="ember"] {
    --body-bg:
      radial-gradient(circle at 20% 0%, rgba(160,60,20,0.28), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(100,30,10,0.38), transparent 50%),
      linear-gradient(160deg, #0c0804 0%, #100a04 50%, #0a0602 100%);
    --bg-panel:      #1c1208;
    --bg-panel-edge: #382210;
    --panel-end:     #140e04;
    --card-end:      #100c02;
    --input-bg:      #0e0a04;
    --green:         #6a2810;
    --green-dark:    #501808;
    --green-bright:  #b04020;
    --gold:          #c07818;
    --gold-bright:   #e8a830;
    --text:          #e8d8c0;
    --text-dim:      #a09070;
    --shadow:        rgba(0,0,0,0.65);
    --arcane:        #6a3820;
    --arcane-bright: #c07040;
    --neutral:       #4a3828;
    --neutral-bright:#907060;
    /* Nudged for WCAG AA — see accessibility pass notes */
    --green-bright:  #da5833;
    --neutral-bright:#9b7a69;
    --btn-hover-bg:  #a13d18;
  }

  /* ---- FONT SIZE SCALE ---- */
  html                        { font-size: 19px; }
  html[data-fontsize="small"]  { font-size: 16px; }
  html[data-fontsize="medium"] { font-size: 19px; }
  html[data-fontsize="large"]  { font-size: 22px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ---- SKIP LINK ---- */
  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    z-index: 2000;
    background: var(--bg-panel);
    color: var(--gold-bright);
    padding: 0.75rem 1.25rem;
    border: 1px solid var(--gold);
    border-radius: 0 0 8px 0;
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    text-decoration: none;
  }
  .skip-link:focus {
    left: 0;
  }

  body {
    min-height: 100vh;
    background: var(--body-bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1rem;
    line-height: 1.75;
  }

  /* ---- PAGE SYSTEM ---- */
  .page { display: none; min-height: 100vh; }
  .page.active { display: flex; }

  .page-col {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: clamp(1.5rem, 5vw, 3rem) 1.25rem;
  }

  .panel {
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--panel-end) 100%);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 14px;
    padding: clamp(1.25rem, 4vw, 2.25rem);
    box-shadow: 0 18px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  /* ---- SCENE HEADER ---- */
  .scene-header { text-align: center; margin-bottom: 0.85rem; }
  .chapter-label {
    font-family: 'Cinzel', serif;
    color: var(--green-bright);
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.35rem;
  }
  .scene-header h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(217,178,91,0.25), 0 1px 2px #000;
    letter-spacing: 0.04em;
  }
  html[data-theme="parchment"] .scene-header h1 { text-shadow: none; }
  .scene-location { font-style: italic; color: var(--text-dim); font-size: 0.95rem; margin-top: 0.3rem; }

  /* ---- CLASS BADGE ---- */
  .class-badge-wrap { text-align: center; margin-bottom: 1rem; }
  .class-badge {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.18rem 0.8rem;
    border-radius: 20px;
    border: 1px solid;
  }
  /* Valdrath's Keep classes */
  .class-badge.fighter { color: var(--green-bright); border-color: var(--green); }
  .class-badge.wizard  { color: var(--arcane-bright); border-color: var(--arcane); }
  .class-badge.rogue   { color: var(--neutral-bright); border-color: var(--neutral); }
  .class-badge.cleric  { color: var(--gold-bright); border-color: var(--gold); }
  /* Court of Stolen Hours classes */
  .class-badge.knight     { color: var(--green-bright); border-color: var(--green); }
  .class-badge.bard       { color: var(--gold-bright); border-color: var(--gold); }
  .class-badge.witch      { color: var(--arcane-bright); border-color: var(--arcane); }
  .class-badge.changeling { color: var(--neutral-bright); border-color: var(--neutral); }

  /* ---- STORY TEXT ---- */
  .story-text { display: flex; flex-direction: column; gap: 1.5rem; cursor: default; }
  .passage {
    margin: 0;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.55s ease forwards;
  }
  .passage.emphasis {
    font-family: 'Cinzel', serif;
    color: var(--gold-bright);
    font-size: 1.25rem;
    letter-spacing: 0.06em;
    text-align: center;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  /* ---- SCENE TRANSITION ---- */
  #scene-content {
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  #scene-content.scene-fade-out {
    opacity: 0;
    transform: translateY(8px);
  }

  @media (prefers-reduced-motion: reduce) {
    .passage { animation: none; opacity: 1; transform: none; }
    #scene-content,
    #scene-content.scene-fade-out {
      transition: none;
      opacity: 1;
      transform: none;
    }
  }

  /* ---- INTERACTION ---- */
  .interaction {
    margin-top: 1.75rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--bg-panel-edge);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .interaction[hidden] { display: none; }
  .choice-prompt {
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: var(--gold-bright);
    text-align: center;
    letter-spacing: 0.03em;
    line-height: 1.35;
  }

  /* ---- BUTTONS ---- */
  .btn-row { display: flex; flex-wrap: wrap; gap: 0.85rem; justify-content: center; }
  button {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    color: var(--btn-text);
    background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
    border: 1px solid var(--green-bright);
    border-radius: 10px;
    padding: 0.7rem 1.6rem;
    min-height: 48px;
    flex: 1 1 auto;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
  }
  button:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--btn-hover-bg) 0%, var(--green) 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 18px var(--shadow);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button.primary {
    background: linear-gradient(180deg, var(--gold-fill) 0%, var(--gold-fill-stop2) 100%);
    border-color: var(--gold-bright);
    color: #2a1f0c;
    font-weight: 700;
  }
  button.primary:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--gold-fill-bright) 0%, var(--gold-fill) 100%);
  }
  html[data-theme="void"] button.primary { color: var(--text); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input[type="text"]:focus-visible {
    outline: 3px solid var(--gold-bright);
    outline-offset: 2px;
  }

  /* STORY CHOICE BUTTONS */
  .choices-col { flex-direction: column; align-items: stretch; }
  .choices-col button { flex: none; width: 100%; text-align: left; font-size: 0.97rem; }
  .back-btn { opacity: 0.55; font-size: 0.85em; margin-top: 0.75rem; border-style: dashed; width: 100%; text-align: left; }
  .back-btn:hover, .back-btn:focus { opacity: 1; }

  /* ---- SETUP PAGE ---- */
  #page-setup { align-items: center; justify-content: center; }
  #page-setup .page-col { align-items: center; text-align: center; max-width: 580px; }
  #page-setup > .page-col > h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(1.8rem, 7vw, 3rem);
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(217,178,91,0.25), 0 1px 2px #000;
    letter-spacing: 0.04em;
    margin-bottom: 0.3rem;
  }
  html[data-theme="parchment"] #page-setup > .page-col > h1 { text-shadow: none; }
  .subtitle { color: var(--green-bright); font-style: italic; font-size: 1.05rem; letter-spacing: 0.03em; margin-bottom: 1.75rem; }
  #setup-box {
    width: 100%;
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--panel-end) 100%);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 14px;
    padding: clamp(1.5rem, 5vw, 2.5rem);
    box-shadow: 0 18px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .setup-intro-text { color: var(--text-dim); font-style: italic; line-height: 1.7; margin-bottom: 1.75rem; }
  .setup-prompt {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    color: var(--gold-bright);
    letter-spacing: 0.03em;
    margin-bottom: 1.25rem;
    line-height: 1.3;
  }
  .setup-field { display: flex; flex-direction: column; gap: 0.85rem; }
  input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 1.1rem;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 0.75rem 0.95rem;
    min-height: 48px;
    text-align: center;
  }
  input[type="text"]::placeholder { color: #6f7a6c; font-style: italic; }
  html[data-theme="parchment"] input[type="text"]::placeholder { color: #8a7a68; }
  .error-msg { color: var(--error); font-size: 0.95rem; font-style: italic; min-height: 1.2rem; }

  /* ---- CLASS PICKER ---- */
  .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-top: 1.25rem; }
  .class-card {
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--card-end) 100%);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 10px;
    padding: 1.1rem 0.85rem;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-height: 48px;
  }
  .class-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--shadow); }
  .class-card:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
  /* Valdrath classes */
  .class-card.fighter { border-color: var(--green); }
  .class-card.fighter:hover, .class-card.fighter:focus-visible { border-color: var(--green-bright); }
  .class-card.fighter .class-card-name { color: var(--green-bright); }
  .class-card.wizard  { border-color: var(--arcane); }
  .class-card.wizard:hover, .class-card.wizard:focus-visible   { border-color: var(--arcane-bright); }
  .class-card.wizard  .class-card-name { color: var(--arcane-bright); }
  .class-card.rogue   { border-color: var(--neutral); }
  .class-card.rogue:hover, .class-card.rogue:focus-visible     { border-color: var(--neutral-bright); }
  .class-card.rogue   .class-card-name { color: var(--neutral-bright); }
  .class-card.cleric  { border-color: var(--gold); }
  .class-card.cleric:hover, .class-card.cleric:focus-visible   { border-color: var(--gold-bright); }
  .class-card.cleric  .class-card-name { color: var(--gold-bright); }
  /* Court of Stolen Hours classes */
  .class-card.knight  { border-color: var(--green); }
  .class-card.knight:hover, .class-card.knight:focus-visible   { border-color: var(--green-bright); }
  .class-card.knight  .class-card-name { color: var(--green-bright); }
  .class-card.bard    { border-color: var(--gold); }
  .class-card.bard:hover, .class-card.bard:focus-visible       { border-color: var(--gold-bright); }
  .class-card.bard    .class-card-name { color: var(--gold-bright); }
  .class-card.witch   { border-color: var(--arcane); }
  .class-card.witch:hover, .class-card.witch:focus-visible     { border-color: var(--arcane-bright); }
  .class-card.witch   .class-card-name { color: var(--arcane-bright); }
  .class-card.changeling { border-color: var(--neutral); }
  .class-card.changeling:hover, .class-card.changeling:focus-visible { border-color: var(--neutral-bright); }
  .class-card.changeling .class-card-name { color: var(--neutral-bright); }
  .class-card-name { font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.08em; }
  .class-card-tag  { font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
  .class-card-desc { font-size: 0.83rem; color: var(--text-dim); font-style: italic; line-height: 1.4; margin-top: 0.2rem; }

  /* ---- LIBRARY PAGE ---- */
  #page-library { align-items: flex-start; }
  .library-col { max-width: 800px; }

  .library-header { text-align: center; margin-bottom: 2rem; }
  .library-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(2rem, 7vw, 3.2rem);
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(217,178,91,0.25), 0 1px 2px #000;
    letter-spacing: 0.04em;
    margin-bottom: 0.3rem;
  }
  html[data-theme="parchment"] .library-title { text-shadow: none; }

  /* Display controls row */
  .library-controls {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    justify-content: center;
    margin-top: 0.9rem;
    flex-wrap: wrap;
  }
  .lib-ctrl-group { display: flex; align-items: center; gap: 0.38rem; }

  /* Theme swatches */
  .swatch {
    width: 22px;
    height: 22px;
    min-height: unset;
    flex: none;
    padding: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.12);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .swatch:hover:not(:disabled) {
    transform: scale(1.18);
    background-color: inherit !important;
    box-shadow: none;
  }
  .swatch[aria-pressed="true"] { border-color: var(--gold-bright); transform: scale(1.12); }
  .swatch-valdrath  { background: #16241b !important; }
  .swatch-parchment { background: #e0c898 !important; border-color: rgba(200,168,112,0.7); }
  .swatch-void      { background: #0c0c1a !important; }
  .swatch-ember     { background: #1c1208 !important; }

  /* Font size buttons */
  .font-btn {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 700;
    min-height: unset;
    flex: none;
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 6px;
    border: 1px solid var(--bg-panel-edge);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .font-btn.sm { font-size: 0.78rem; }
  .font-btn.md { font-size: 1rem; }
  .font-btn.lg { font-size: 1.22rem; }
  .font-btn:hover:not(:disabled) {
    background: transparent;
    transform: none;
    box-shadow: none;
    color: var(--gold-text);
    border-color: var(--gold);
  }
  .font-btn[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--gold-fill) 0%, var(--gold-fill-stop2) 100%);
    border-color: var(--gold-bright);
    color: #2a1f0c;
  }
  html[data-theme="void"] .font-btn[aria-pressed="true"] { color: var(--text); }
  .font-btn[aria-pressed="true"]:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--gold-fill-bright) 0%, var(--gold-fill) 100%);
    transform: none;
    box-shadow: none;
    color: #2a1f0c;
  }
  html[data-theme="void"] .font-btn[aria-pressed="true"]:hover:not(:disabled) { color: var(--text); }

  /* Typewriter toggle */
  .tw-btn {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    min-height: unset;
    flex: none;
    padding: 0.28rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--bg-panel-edge);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .tw-btn:hover:not(:disabled) {
    background: transparent;
    transform: none;
    box-shadow: none;
    color: var(--gold-text);
    border-color: var(--gold);
  }
  .tw-btn[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--gold-fill) 0%, var(--gold-fill-stop2) 100%);
    border-color: var(--gold-bright);
    color: #2a1f0c;
  }
  html[data-theme="void"] .tw-btn[aria-pressed="true"] { color: var(--text); }
  .tw-btn[aria-pressed="true"]:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--gold-fill-bright) 0%, var(--gold-fill) 100%);
    transform: none;
    box-shadow: none;
    color: #2a1f0c;
  }
  html[data-theme="void"] .tw-btn[aria-pressed="true"]:hover:not(:disabled) { color: var(--text); }

  /* ---- STORY GRID ---- */
  .story-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.25rem;
    width: 100%;
  }
  .story-card {
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--card-end) 100%);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 14px;
    padding: clamp(1.25rem, 4vw, 1.75rem);
    text-align: left;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--text);
    width: 100%;
  }
  .story-card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px var(--shadow);
  }
  .story-card-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    color: var(--gold-bright);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }
  .story-card-blurb {
    font-size: 0.92rem;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.55;
  }
  .story-card-classes { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.25rem; }

  /* Save slot buttons */
  .slot-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.65rem;
    margin-top: 0.25rem;
  }
  .slot-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.55rem 0.5rem;
    min-height: 52px;
    gap: 0.12rem;
    border-radius: 8px;
    font-family: 'Cinzel', serif;
  }
  .slot-label {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .slot-info { font-size: 0.75rem; letter-spacing: 0.02em; }
  .slot-btn.slot-empty {
    background: transparent;
    border: 1px dashed var(--bg-panel-edge);
    color: var(--text-dim);
    font-weight: 400;
  }
  .slot-btn.slot-empty .slot-label { color: var(--text-dim); opacity: 0.7; }
  .slot-btn.slot-empty:hover:not(:disabled) {
    background: transparent;
    transform: translateY(-1px);
    box-shadow: none;
    border-color: var(--green-bright);
    color: var(--text);
  }
  .slot-btn.slot-filled {
    background: linear-gradient(180deg, var(--gold-fill) 0%, var(--gold-fill-stop2) 100%);
    border-color: var(--gold-bright);
    color: #2a1f0c;
    font-weight: 600;
  }
  .slot-btn.slot-filled .slot-label { color: rgba(42,31,12,0.65); }
  .slot-btn.slot-filled:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--gold-fill-bright) 0%, var(--gold-fill) 100%);
  }
  html[data-theme="void"] .slot-btn.slot-filled { color: var(--text); }
  html[data-theme="void"] .slot-btn.slot-filled .slot-label { color: rgba(200,220,232,0.65); }

  .story-card-endings {
    font-size: 0.78rem;
    color: var(--gold-text);
    font-style: italic;
    letter-spacing: 0.02em;
  }

  /* Epilogue unlock button */
  .epilogue-btn {
    display: block;
    width: 100%;
    margin-top: 0.35rem;
    padding: 0.6rem 0.5rem;
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: center;
    color: var(--gold-text);
    background: transparent;
    border: 1px solid var(--gold);
    border-radius: 8px;
    box-shadow: 0 0 10px -2px var(--gold);
  }
  .epilogue-btn:hover:not(:disabled),
  .epilogue-btn:focus-visible {
    color: #2a1f0c;
    background: linear-gradient(180deg, var(--gold-fill-bright) 0%, var(--gold-fill) 100%);
    box-shadow: 0 0 16px -2px var(--gold-bright);
    transform: translateY(-1px);
  }
  .epilogue-btn:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  html[data-theme="void"] .epilogue-btn:hover:not(:disabled),
  html[data-theme="void"] .epilogue-btn:focus-visible { color: var(--text); }

  /* Class chips */
  .story-class-chip {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.15rem 0.6rem;
    border-radius: 20px;
    border: 1px solid;
  }
  /* Valdrath */
  .story-class-chip.fighter { color: var(--green-bright); border-color: var(--green); }
  .story-class-chip.wizard  { color: var(--arcane-bright); border-color: var(--arcane); }
  .story-class-chip.rogue   { color: var(--neutral-bright); border-color: var(--neutral); }
  .story-class-chip.cleric  { color: var(--gold-text); border-color: var(--gold); }
  /* Fae Court */
  .story-class-chip.knight     { color: var(--green-bright); border-color: var(--green); }
  .story-class-chip.bard       { color: var(--gold-text); border-color: var(--gold); }
  .story-class-chip.witch      { color: var(--arcane-bright); border-color: var(--arcane); }
  .story-class-chip.changeling { color: var(--neutral-bright); border-color: var(--neutral); }
  .story-class-chip.unknown    { color: var(--neutral-bright); border-color: var(--neutral); }

  /* ---- HISTORY PANEL ---- */
  .history-panel {
    margin-top: 0.85rem;
    border-top: 1px solid var(--bg-panel-edge);
    padding-top: 0.6rem;
  }
  .history-panel[hidden] { display: none; }
  .history-toggle {
    all: unset;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    box-sizing: border-box;
    padding: 0.15rem 0;
  }
  .history-toggle:focus-visible { outline: 2px solid var(--gold); border-radius: 2px; }
  .history-chevron { margin-left: 0.5rem; }
  .history-list {
    margin-top: 0.45rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    max-height: 180px;
    overflow-y: auto;
  }
  .history-list[hidden] { display: none; }
  .history-item {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    color: var(--text-dim);
    padding: 0.15rem 0.5rem;
    border-left: 2px solid transparent;
    letter-spacing: 0.04em;
  }
  .history-item.current { color: var(--gold-text); border-left-color: var(--gold); }

  /* ---- MUTE TOGGLE (fixed, always visible) ---- */
  #mute-toggle {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 999;
    width: 44px;
    height: 44px;
    min-height: unset;
    padding: 0;
    font-size: 1.25rem;
    font-family: inherit;
    border-radius: 50%;
    background: var(--bg-panel);
    border: 1px solid var(--bg-panel-edge);
    color: var(--gold-bright);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.75;
    transition: opacity 0.2s;
  }
  #mute-toggle:hover { opacity: 1; transform: none; box-shadow: none; background: var(--bg-panel); }

  /* ---- ACHIEVEMENT PANEL (card trigger) ---- */
  .story-card-achievements {
    border-top: 1px solid var(--bg-panel-edge);
    margin-top: 0.5rem;
    padding-top: 0.5rem;
  }
  .achievements-toggle {
    all: unset;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--gold-text);
    font-style: italic;
    letter-spacing: 0.02em;
    box-sizing: border-box;
  }
  .achievements-toggle:hover { color: var(--gold-text); }
  .achievements-toggle:focus-visible { outline: 2px solid var(--gold); border-radius: 2px; }
  .achievements-chevron { margin-left: 0.5rem; font-style: normal; font-size: 1em; }

  /* ---- ACHIEVEMENTS MODAL ---- */
  #achievements-modal {
    position: fixed;
    inset: 0;
    z-index: 1100;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #achievements-modal[hidden] { display: none !important; }
  .ach-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
  }
  .ach-modal-box {
    position: relative;
    background: var(--bg-panel);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 10px;
    padding: 1.5rem;
    width: min(580px, calc(100vw - 2rem));
    max-height: calc(100vh - 4rem);
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.75);
  }
  .ach-modal-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
  .ach-modal-title {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--gold-bright);
    margin: 0;
    text-wrap: balance;
  }
  .ach-modal-close {
    all: unset;
    cursor: pointer;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--text-dim);
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .ach-modal-close:hover { color: var(--text); }
  .ach-modal-close:focus-visible { outline: 2px solid var(--gold); }
  .ach-modal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.65rem;
  }
  .ach-item {
    background: var(--bg);
    border: 1px solid var(--bg-panel-edge);
    border-radius: 8px;
    padding: 0.8rem 0.65rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }
  .ach-item-unlocked { border-color: var(--gold); }
  .ach-item-locked { opacity: 0.4; }
  .ach-item-icon { font-size: 1.75rem; line-height: 1; margin-bottom: 0.1rem; }
  .ach-item-locked .ach-item-icon { filter: grayscale(1); }
  .ach-item-title { font-size: 0.75rem; font-weight: 600; color: var(--gold-bright); line-height: 1.3; }
  .ach-item-locked .ach-item-title { color: var(--text-dim); }
  .ach-item-desc { font-size: 0.68rem; color: var(--text-dim); line-height: 1.4; }

  /* ---- ACHIEVEMENT TOAST ---- */
  .achievement-toast {
    position: fixed;
    bottom: 5rem;
    right: 1.25rem;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--bg-panel);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 0.65rem 1rem;
    max-width: 260px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.35s, transform 0.35s;
    pointer-events: none;
  }
  .achievement-toast.achievement-toast-visible { opacity: 1; transform: translateY(0); }
  .achievement-toast-icon { font-size: 1.5rem; flex-shrink: 0; }
  .achievement-toast-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold-text);
    font-family: 'Cinzel', serif;
  }
  .achievement-toast-title { font-size: 0.9rem; font-weight: 600; color: var(--text); margin-top: 0.1rem; }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 480px) {
    .btn-row button { flex: 1 1 100%; }
    .class-grid { grid-template-columns: 1fr; }
    .story-grid { grid-template-columns: 1fr; }
    .library-controls { gap: 0.85rem; }
  }
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to content</a>

<button id="mute-toggle" aria-label="Toggle audio"><span aria-hidden="true">🔊</span></button>

<main id="main-content" tabindex="-1">

<!-- LIBRARY PAGE — story selection, shown on app open -->
<section id="page-library" class="page" aria-label="Story library">
  <div class="page-col library-col">
    <header class="library-header">
      <h1 class="library-title">Adventure Stories</h1>
      <p class="subtitle">Choose your tale</p>
      <div class="library-controls" aria-label="Display settings">
        <div class="lib-ctrl-group" aria-label="Colour theme">
          <button class="swatch swatch-valdrath" data-theme-set="valdrath" aria-label="Valdrath theme" aria-pressed="true" title="Valdrath — Dark Forest"></button>
          <button class="swatch swatch-parchment" data-theme-set="parchment" aria-label="Parchment theme" aria-pressed="false" title="Parchment — Warm Light"></button>
          <button class="swatch swatch-void" data-theme-set="void" aria-label="Void theme" aria-pressed="false" title="Void — Deep Dark"></button>
          <button class="swatch swatch-ember" data-theme-set="ember" aria-label="Ember theme" aria-pressed="false" title="Ember — Volcanic"></button>
        </div>
        <div class="lib-ctrl-group" aria-label="Text size">
          <button class="font-btn sm" data-fontsize-set="small" aria-label="Small text" aria-pressed="false" title="Small text">A</button>
          <button class="font-btn md" data-fontsize-set="medium" aria-label="Medium text" aria-pressed="true" title="Medium text">A</button>
          <button class="font-btn lg" data-fontsize-set="large" aria-label="Large text" aria-pressed="false" title="Large text">A</button>
        </div>
        <button class="tw-btn" id="tw-toggle" aria-label="Typewriter mode" aria-pressed="false" title="Typewriter mode: OFF"><span aria-hidden="true">✦</span> Typewriter</button>
      </div>
    </header>
    <div id="story-grid" class="story-grid" role="list"></div>
  </div>
</section>

<!-- SETUP PAGE -->
<section id="page-setup" class="page" aria-label="Character creation">
  <div class="page-col">
    <h1 id="setup-title"></h1>
    <p class="subtitle">A choose your own adventure</p>
    <div id="setup-box">
      <div id="setup-content"></div>
    </div>
  </div>
</section>

<!-- SCENE PAGE — all story content renders here dynamically -->
<section id="page-scene" class="page" aria-label="Adventure">
  <div class="page-col">
    <div id="scene-content">
      <div class="scene-header">
        <p id="scene-chapter" class="chapter-label"></p>
        <h1 id="scene-title"></h1>
        <p id="scene-location" class="scene-location"></p>
      </div>
      <div class="class-badge-wrap">
        <span id="class-badge" class="class-badge"></span>
      </div>
      <div class="panel" aria-live="polite">
        <div id="scene-text" class="story-text"></div>
        <div id="scene-interact" class="interaction" hidden></div>
      </div>
    </div>
    <div id="history-panel" class="history-panel" hidden>
      <button type="button" class="history-toggle" id="history-toggle"
              aria-expanded="false" aria-controls="history-list">
        <span>Journey So Far</span><span class="history-chevron" aria-hidden="true">▾</span>
      </button>
      <div id="history-list" class="history-list" hidden></div>
    </div>
  </div>
</section>

</main>

<script src="catalog.js"></script>
<script src="audio.js"></script>
<script src="engine.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
