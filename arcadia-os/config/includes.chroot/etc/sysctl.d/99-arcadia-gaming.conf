# Arcadia OS — kernel tuning for gaming
# Dropped into every built image via config/includes.chroot.

# Many modern titles (Elden Ring, Star Citizen, Hogwarts Legacy, several Proton
# games) exhaust the default mmap count and crash. This is the value SteamOS
# and Fedora now ship by default.
vm.max_map_count = 2147483642

# Prefer keeping game data in RAM over swapping it out.
vm.swappiness = 10

# Larger dirty ratios smooth out shader-cache / asset writes during play.
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5

# Bigger network buffers help game downloads and streaming.
net.core.rmem_max = 2500000
net.core.wmem_max = 2500000

# Allow more concurrent file watches (mod managers, launchers, editors).
fs.inotify.max_user_watches = 524288
