; Arcadia OS — Feral GameMode configuration
; Applied automatically when a GameMode-aware game (Steam, Lutris, etc.) runs.

[general]
; Switch the CPU to the performance governor while a game is active.
desiredgov=performance
; Restore this governor when the game exits.
defaultgov=schedutil
; Ask for the highest GPU performance level (amd/nvidia).
desiredgpu=1
gpu_device=0
; Give the game process a scheduling boost.
renice=10
softrealtime=auto

[filter]
; Leave these free for people to extend with their own allow/deny lists.

[custom]
; Optional: notify via the desktop when GameMode starts/stops.
; start=notify-send "GameMode activated"
; end=notify-send "GameMode deactivated"
