# Arcadia OS — resource limits for gaming
#
# GameMode and low-latency audio (PipeWire) both benefit from real-time
# priority and higher memlock limits. The @sudo group covers the primary
# desktop user created by the installer.

@sudo   -  rtprio     98
@sudo   -  nice      -20
@sudo   -  memlock    unlimited

# Raise the open-file ceiling for Steam/Proton, which spawn many shader
# compiler processes and open large numbers of files.
*       soft  nofile  1048576
*       hard  nofile  1048576
